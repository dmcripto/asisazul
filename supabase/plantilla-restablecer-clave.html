<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#243238">
  <h2 style="margin:0 0 12px;color:#2f6f6c">Asisazul</h2>
  <p style="font-size:18px;line-height:1.5">Pediste cambiar tu contraseña. Escribe este código en la app y elige una contraseña nueva:</p>
  <p style="font-size:34px;font-weight:bold;letter-spacing:6px;background:#d3ece6;border-radius:12px;padding:16px;text-align:center">{{ .Token }}</p>
  <p style="font-size:16px;line-height:1.5">El código vale por poco tiempo. Si tú no lo pediste, ignora este mensaje: tu contraseña no cambia.</p>
</div>
